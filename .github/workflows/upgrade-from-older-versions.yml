#
# Installs an older Absence, fills it with invented data, moves to the code of
# the pull request and checks that everything entered is still there.
#
# From: 1.0.12 (commit 0d84f4d), which HR used before the betas, and 1.0.0-beta.1.
# How: `occ upgrade` over the replaced folder, or app removed and enabled again.

name: Upgrade from older versions

on: pull_request

permissions:
  contents: read

concurrency:
  group: upgrade-from-older-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes-and-matrix:
    runs-on: ubuntu-latest-low
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}
      php-min: ${{ steps.versions.outputs.php-min }}
      server-min: ${{ steps.versions.outputs.branches-min }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/upgrade-from-older-versions.yml'
              - 'appinfo/**'
              - 'lib/**'
              - 'tests/Upgrade/**'

      - name: Checkout app
        if: steps.changes.outputs.src != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix
        if: steps.changes.outputs.src != 'false'
        id: versions
        uses: nextcloud-libraries/nextcloud-version-matrix@71959de73c244b11ecbf4503b87c41d65b0f64ae # v1.3.4

  upgrade:
    runs-on: ubuntu-latest

    needs: changes-and-matrix
    if: needs.changes-and-matrix.outputs.src != 'false'

    strategy:
      fail-fast: false
      matrix:
        database: ['sqlite', 'mysql', 'pgsql', 'oci']
        from: ['1.0.12', '1.0.0-beta.1']
        how: ['upgrade', 'reinstall']
        include:
          - from: '1.0.12'
            ref: 0d84f4da14aea8564ba666d3cfd31f60123302bc
          - from: '1.0.0-beta.1'
            ref: v1.0.0-beta.1

    name: ${{ matrix.from }} ${{ matrix.how }} on ${{ matrix.database }}

    services:
      mysql:
        image: ghcr.io/nextcloud/continuous-integration-mysql-8.4:latest # zizmor: ignore[unpinned-images]
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 10
      postgres:
        image: ghcr.io/nextcloud/continuous-integration-postgres-16:latest # zizmor: ignore[unpinned-images]
        ports:
          - 4445:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ needs.changes-and-matrix.outputs.server-min }}

      - name: Add the viewer app where the server does not ship it
        env:
          SERVER_BRANCH: ${{ needs.changes-and-matrix.outputs.server-min }}
        run: |
          # `occ upgrade` refuses to run while an always-enabled app has no files
          if [ ! -d apps/viewer ]; then
            git clone --depth 1 --branch "$SERVER_BRANCH" https://github.com/nextcloud/viewer.git apps/viewer
          fi

      - name: Checkout Absence ${{ matrix.from }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
          path: apps/absence

      - name: Checkout the code to upgrade to
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: new-absence

      - name: Set up php ${{ needs.changes-and-matrix.outputs.php-min }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ needs.changes-and-matrix.outputs.php-min }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite, mysql, pdo_mysql, pgsql, pdo_pgsql${{ matrix.database == 'oci' && ', oci8' || '' }}
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Oracle
        if: matrix.database == 'oci'
        run: |
          # Not a service: only these jobs need it, and it is slow to start
          docker run -d --name oracle -p 1521:1521 -e ORACLE_PASSWORD=oracle ghcr.io/gvenzl/oracle-free:23 # zizmor: ignore[unpinned-images]
          for _ in $(seq 1 60); do
            docker exec oracle healthcheck.sh && exit 0
            sleep 5
          done
          docker logs oracle | tail -20
          exit 1

      - name: Install Nextcloud with Absence ${{ matrix.from }}
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          mkdir data
          case "$DATABASE" in
            sqlite) ./occ maintenance:install --verbose --database=sqlite --admin-user admin --admin-pass admin ;;
            mysql) ./occ maintenance:install --verbose --database=mysql --database-name=nextcloud --database-host=127.0.0.1 --database-port=4444 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin ;;
            pgsql) ./occ maintenance:install --verbose --database=pgsql --database-name=nextcloud --database-host=127.0.0.1 --database-port=4445 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin ;;
            oci) ./occ maintenance:install --verbose --database=oci --database-name=FREE --database-host=127.0.0.1 --database-port=1521 --database-user=system --database-pass=oracle --admin-user admin --admin-pass admin ;;
          esac
          ./occ app:enable --force absence
          ./occ config:app:get absence installed_version

      - name: Enter invented data on ${{ matrix.from }}
        run: |
          php new-absence/tests/Upgrade/upgrade-check.php "$PWD" seed
          php new-absence/tests/Upgrade/upgrade-check.php "$PWD" snapshot before.json

      - name: Move to the new code
        env:
          HOW: ${{ matrix.how }}
        run: |
          installed=$(./occ config:app:get absence installed_version)
          new=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' new-absence/appinfo/info.xml)
          if [ "$installed" = "$new" ]; then
            # Unreleased code keeps the version of the last release, and Nextcloud only
            # runs migrations for a new version: bump it here like the release will.
            sed -i "s:<version>$new</version>:<version>$new.1</version>:" new-absence/appinfo/info.xml
          fi
          if [ "$HOW" = reinstall ]; then
            ./occ app:remove absence
            mv new-absence apps/absence
            ./occ app:enable --force absence
          else
            rm -rf apps/absence
            mv new-absence apps/absence
            ./occ upgrade
          fi
          ./occ config:app:get absence installed_version

      - name: Check the data
        run: php apps/absence/tests/Upgrade/upgrade-check.php "$PWD" verify before.json
